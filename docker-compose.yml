services:
  frameo:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    cpus: ${FRAMEO_CPUS:-1.0}
    mem_limit: ${FRAMEO_MEMORY_LIMIT:-1024m}
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://frameo:frameo@postgres:5432/frameo?schema=public
      STORAGE_ROOT: /app/storage
      MAX_UPLOAD_BYTES: "5368709120"
      DEMO_MODE: "false"
      FRAMEO_SEED_DEMO: "false"
      FRAMEO_GENERATE_HLS: ${FRAMEO_GENERATE_HLS:-false}
      EXTERNAL_MEDIA_EXCLUDE: ${EXTERNAL_MEDIA_EXCLUDE:-stash}
      STASH_GRAPHQL_URL: ${STASH_GRAPHQL_URL:-}
      STASH_API_KEY: ${STASH_API_KEY:-}
      STASH_LIBRARY_PREFIX: ${STASH_LIBRARY_PREFIX:-/home}
      EXTERNAL_MEDIA_STORAGE_PATH: ${EXTERNAL_MEDIA_STORAGE_PATH:-external/library}
      NEXT_PUBLIC_APP_NAME: Frameo
      NODE_OPTIONS: --max-old-space-size=${NODE_MAX_OLD_SPACE_MB:-512}
    volumes:
      - frameo_media:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    cpus: ${POSTGRES_CPUS:-0.5}
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-384m}
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-96MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-20}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-2MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-32MB}
    environment:
      POSTGRES_DB: frameo
      POSTGRES_USER: frameo
      POSTGRES_PASSWORD: frameo
    volumes:
      - frameo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frameo -d frameo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  frameo_media:
  frameo_postgres:
